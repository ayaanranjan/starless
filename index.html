<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STARLESS</title>
  <meta name="description" content="A co-op space horror game. Play with friends in your browser." />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/ui/ui.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; width: 100%; height: 100%; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #6b7a86; font: 13px 'Share Tech Mono', monospace; letter-spacing: .3em; background: #000; z-index: 9999; transition: opacity .6s; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .err { color: #ff6b6b; letter-spacing: .05em; max-width: 80vw; white-space: pre-wrap; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <div id="boot"><div>ESTABLISHING SIGNAL…</div></div>
  <script>
    window.addEventListener('error', function (e) {
      var b = document.getElementById('boot');
      if (b && !b.classList.contains('gone')) b.innerHTML = '<div class="err">Boot error: ' + (e.message || e) + '</div>';
    });
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
